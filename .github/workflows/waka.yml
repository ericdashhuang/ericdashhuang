name: Waka Readme

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://wakapi.dev/api
          TIME_RANGE: all_time
          SHOW_TOTAL: true
          LANG_COUNT: 10
