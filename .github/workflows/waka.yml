name: Waka Readme

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://wakapi.dev/api
          TIME_RANGE: all_time
          SHOW_TOTAL: true
          LANG_COUNT: 10
          CODE_LANG: ocaml

      # github colors the ++ in C++ differently from the rest of the name so rename it
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show C++ as Cpp
        run: |
          sed -i '/START_SECTION:waka/,/END_SECTION:waka/s/^C++ /Cpp /' README.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Show C++ as Cpp in stats"
            git push
          fi
